<!doctype html>
<html><head><meta charset="utf-8"><title>Game Boy games</title></head>
<body>
  <header><form action="/search" method="get"><input type="hidden" name="type" value="roms"><input type="search" name="q"></form></header>
  <main>
    <div class="grid">
      <div class="game-card">
        <a class="thumb" href="/game/pixel-quest"><img src="/static/placeholder.gif" data-src="/covers/pixel-quest.png" alt="Pixel Quest"></a>
        <h3 class="game-title"><a href="/game/pixel-quest">Pixel Quest</a></h3>
        <span class="size">256 KB</span>
      </div>
      <div class="game-card">
        <a class="thumb" href="/game/block-mania"><img src="/static/placeholder.gif" data-src="/covers/block-mania.png" alt="Block Mania"></a>
        <h3 class="game-title"><a href="/game/block-mania">Block Mania</a></h3>
        <span class="size">32 KB</span>
      </div>
      <div class="game-card">
        <a class="thumb" href="/game/pocket-golf"><img src="/static/placeholder.gif" data-src="/covers/pocket-golf.png" alt="Pocket Golf"></a>
        <h3 class="game-title"><a href="/game/pocket-golf">Pocket Golf</a></h3>
        <span class="size">64 KB</span>
      </div>
    </div>
    <div class="pagination"></div>
  </main>
</body></html>
